[package]
name = "scenery-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.5"
httpdate = "1"
base64 = "0.22"
bytes = "1"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.4"
glob = "0.3"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
mime_guess = "2"
notify = "=8.2.1"
multer = "3"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
ring = "0.17"
rustix = { version = "1", features = ["fs", "process"] }
scenery-wire = { path = "../scenery-sdk/scenery-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
sha2 = "0.11"
subtle = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["native-certs", "ring", "webpki-roots"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
unicode-normalization = "0.1"
url = "2"
