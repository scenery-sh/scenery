[package]
name = "scenery-sdk"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1"
futures-core = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
scenery-wire = { path = "scenery-wire" }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
