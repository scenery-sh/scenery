<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">One command runs the whole app</title>
  <desc id="desc">scenery up starts Go services as one process per service, background jobs, schedules and events, managed PostgreSQL in Docker, frontend dev servers behind one router, the dev console with logs, traces and data, and live rebuilds that restart only the services that changed. scenery ps, scenery logs --follow and scenery down inspect and stop it.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .base { fill: none; stroke: #33407A; stroke-width: 2; }
    .flow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 4 10; animation: flow 1.4s linear infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.55" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2F78"/>
      <stop offset="1" stop-color="#0E1333"/>
    </linearGradient>
    <clipPath id="markClip"><rect width="64" height="64" rx="16"/></clipPath>
    <symbol id="mark" viewBox="0 0 64 64">
      <g clip-path="url(#markClip)">
        <rect width="64" height="64" fill="url(#markBg)"/>
        <circle cx="41" cy="23" r="10" fill="url(#sun)"/>
        <path d="M-4 52 L17 30 L28 41 L36 34 L68 58 V68 H-4 Z" fill="#8B5CF6"/>
        <path d="M-4 60 L15 47 L28 56 L45 43 L68 60 V68 H-4 Z" fill="#22D3EE"/>
      </g>
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
    </symbol>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F26"/>
      <stop offset="1" stop-color="#151239"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="termGlow" cx="600" cy="262" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="termStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="titleText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="520" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="520" fill="url(#bg)"/>
    <rect width="1200" height="520" fill="url(#dots)"/>
    <rect width="1200" height="520" fill="url(#termGlow)"/>
  </g>

  <text x="600" y="92" text-anchor="middle" class="sans" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#F5F7FF">One command.</text>
  <text x="600" y="130" text-anchor="middle" class="sans" font-size="30" font-weight="800" letter-spacing="-0.5" fill="url(#titleText)">The whole app.</text>

    <path d="M396 272 C340 272 380 86 324 86" class="base"/>
    <path d="M396 272 C340 272 380 86 324 86" class="flow" stroke="#22D3EE"/>
    <circle cx="324" cy="86" r="3.5" fill="#22D3EE"/>
    <path d="M396 272 C340 272 380 260 324 260" class="base"/>
    <path d="M396 272 C340 272 380 260 324 260" class="flow" stroke="#A78BFA"/>
    <circle cx="324" cy="260" r="3.5" fill="#A78BFA"/>
    <path d="M396 272 C340 272 380 434 324 434" class="base"/>
    <path d="M396 272 C340 272 380 434 324 434" class="flow" stroke="#38BDF8"/>
    <circle cx="324" cy="434" r="3.5" fill="#38BDF8"/>
    <path d="M804 272 C860 272 820 86 876 86" class="base"/>
    <path d="M804 272 C860 272 820 86 876 86" class="flow" stroke="#F472B6"/>
    <circle cx="876" cy="86" r="3.5" fill="#F472B6"/>
    <path d="M804 272 C860 272 820 260 876 260" class="base"/>
    <path d="M804 272 C860 272 820 260 876 260" class="flow" stroke="#34D399"/>
    <circle cx="876" cy="260" r="3.5" fill="#34D399"/>
    <path d="M804 272 C860 272 820 434 876 434" class="base"/>
    <path d="M804 272 C860 272 820 434 876 434" class="flow" stroke="#FBBF24"/>
    <circle cx="876" cy="434" r="3.5" fill="#FBBF24"/>
    <circle cx="396" cy="272" r="4.5" fill="#22D3EE"/>
    <circle cx="804" cy="272" r="4.5" fill="#F472B6"/>

  <g>
    <rect x="400" y="176" width="400" height="172" rx="16" fill="#0B1029"/>
    <path d="M400 210 V192 A16 16 0 0 1 416 176 H784 A16 16 0 0 1 800 192 V210 Z" fill="#161E48"/>
    <circle cx="422" cy="193" r="5.5" fill="#FF5F57"/>
    <circle cx="440" cy="193" r="5.5" fill="#FEBC2E"/>
    <circle cx="458" cy="193" r="5.5" fill="#28C840"/>
    <rect x="401" y="177" width="398" height="170" rx="15" fill="none" stroke="url(#termStroke)" stroke-width="2"/>
    <text x="424" y="252" class="mono" font-size="24" font-weight="700"><tspan fill="#7C86B2">$</tspan><tspan fill="#F5F7FF"> scenery up</tspan></text>
    <rect class="cursor" x="600" y="232" width="12" height="24" fill="#22D3EE"/>
    <text x="424" y="284" class="mono" font-size="14" font-weight="700" fill="#F5F7FF">scenery development server running</text>
    <text x="424" y="310" class="mono" font-size="13" fill="#A9B2D6"><tspan fill="#22D3EE">➜</tspan><tspan x="442">API:</tspan><tspan x="530" fill="#22D3EE">http://localhost:4624/api/</tspan></text>
    <text x="424" y="332" class="mono" font-size="13" fill="#A9B2D6"><tspan fill="#22D3EE">➜</tspan><tspan x="442">Dashboard:</tspan><tspan x="530" fill="#22D3EE">http://localhost:4624/console/</tspan></text>
  </g>

    <rect x="378.1" y="378" width="107.0" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.05" stroke="#33407A"/>
    <text x="431.6" y="398" text-anchor="middle" class="mono" font-size="13" fill="#A9B2D6">scenery ps</text>
    <rect x="495.1" y="378" width="193.9" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.05" stroke="#33407A"/>
    <text x="592.1" y="398" text-anchor="middle" class="mono" font-size="13" fill="#A9B2D6">scenery logs --follow</text>
    <rect x="699.0" y="378" width="122.8" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.05" stroke="#33407A"/>
    <text x="760.4" y="398" text-anchor="middle" class="mono" font-size="13" fill="#A9B2D6">scenery down</text>

  <g>
    <rect x="40" y="40" width="280" height="92" rx="18" fill="#111836" stroke="#27305C"/>
    <circle cx="82" cy="86" r="22" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="82" y="91.0" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#22D3EE">Go</text>
    <text x="118" y="81" class="sans" font-size="19" font-weight="700" fill="#F5F7FF">Go services</text>
    <text x="118" y="105" class="sans" font-size="15" fill="#A9B2D6">a process per service</text>
  </g>
  <g>
    <rect x="40" y="214" width="280" height="92" rx="18" fill="#111836" stroke="#27305C"/>
    <circle cx="82" cy="260" r="22" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.55"/>
    <circle cx="82" cy="260.0" r="8" stroke="#A78BFA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M82 255.5 V260.0 L85.5 262.0" stroke="#A78BFA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="118" y="255" class="sans" font-size="19" font-weight="700" fill="#F5F7FF">Background work</text>
    <text x="118" y="279" class="sans" font-size="15" fill="#A9B2D6">jobs, cron, events</text>
  </g>
  <g>
    <rect x="40" y="388" width="280" height="92" rx="18" fill="#111836" stroke="#27305C"/>
    <circle cx="82" cy="434" r="22" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.55"/>
    <ellipse cx="82" cy="429.0" rx="7.5" ry="2.8" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M74.5 429.0 V439.0 A7.5 2.8 0 0 0 89.5 439.0 V429.0" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M74.5 434.0 A7.5 2.8 0 0 0 89.5 434.0" stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="118" y="429" class="sans" font-size="19" font-weight="700" fill="#F5F7FF">PostgreSQL</text>
    <text x="118" y="453" class="sans" font-size="15" fill="#A9B2D6">managed in Docker</text>
  </g>
  <g>
    <rect x="880" y="40" width="280" height="92" rx="18" fill="#111836" stroke="#27305C"/>
    <circle cx="922" cy="86" r="22" fill="#F472B6" fill-opacity="0.14" stroke="#F472B6" stroke-opacity="0.55"/>
    <rect x="913" y="79.0" width="18" height="14" rx="2.5" stroke="#F472B6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M913 83.5 H931" stroke="#F472B6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="958" y="81" class="sans" font-size="19" font-weight="700" fill="#F5F7FF">Frontends</text>
    <text x="958" y="105" class="sans" font-size="15" fill="#A9B2D6">dev servers, routed</text>
  </g>
  <g>
    <rect x="880" y="214" width="280" height="92" rx="18" fill="#111836" stroke="#27305C"/>
    <circle cx="922" cy="260" r="22" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.55"/>
    <path d="M913 261.0 H917 L920 254.0 L923.5 267.0 L926 258.0 L927.5 261.0 H931" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="958" y="255" class="sans" font-size="19" font-weight="700" fill="#F5F7FF">Dev console</text>
    <text x="958" y="279" class="sans" font-size="15" fill="#A9B2D6">logs, traces, data</text>
  </g>
  <g>
    <rect x="880" y="388" width="280" height="92" rx="18" fill="#111836" stroke="#27305C"/>
    <circle cx="922" cy="434" r="22" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.55"/>
    <path d="M929 431.0 A7.5 7.5 0 1 0 929.5 436.0" stroke="#FBBF24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M929.5 426.0 V431.5 H924" stroke="#FBBF24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="958" y="429" class="sans" font-size="19" font-weight="700" fill="#F5F7FF">Live rebuilds</text>
    <text x="958" y="453" class="sans" font-size="15" fill="#A9B2D6">only changed services</text>
  </g>
</svg>
