name: CI

"on":
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Check formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Prepare dashboard embed
        run: ./scripts/build-dashboard-ui-embed.sh

      - name: Verify repository
        run: go run ./scripts/verify --summary --write

      - name: Lint dashboard
        working-directory: apps/console
        run: bun run lint

      - name: Test dashboard
        working-directory: apps/console
        run: bun test tests
